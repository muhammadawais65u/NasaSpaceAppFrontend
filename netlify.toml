[build]
  publish = "build/web"
  command = "curl -fsSL -o /tmp/flutter.tar.xz https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz && tar -xJf /tmp/flutter.tar.xz -C /tmp && /tmp/flutter/bin/flutter build web --release"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
